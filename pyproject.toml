[project]
name = "homework-management-system"
version = "0.1.0"
description = "Offline electronic homework management"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.2,<5.3", "djangorestframework>=3.16,<3.17",
  "waitress>=3.0,<4", "whitenoise>=6.9,<7", "python-docx>=1.2,<2",
  "pypdf>=6,<7", "pygments>=2.19,<3"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "pyinstaller>=6.16,<7"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]
